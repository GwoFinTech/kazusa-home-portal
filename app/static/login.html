<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/common.css?v=tokens-v2">
  <title>sign in — home</title>
  <style>
    body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-shell {
      background: var(--hover-bg); border: 1px solid var(--border);
      border-radius: calc(var(--radius-lg) + 6px); padding: 8px;
      box-shadow: var(--shadow-1);
      animation: shell-in 500ms var(--ease-out) backwards;
    }
    @keyframes shell-in {
      from { opacity: 0; transform: translateY(12px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .login-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 40px; text-align: center; max-width: 340px; width: 100%;
      box-shadow: inset 0 1px 1px rgba(255,255,255,.06);
    }
    .login-card h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
    .login-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
    .divider {
      display: flex; align-items: center; gap: 12px; margin: 20px 0;
      font-size: 12px; color: var(--text-subtle);
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    #qr-section { display: none; margin-top: 24px; }
    #qr-display {
      padding: 16px; background: #fff; border-radius: 12px;
      display: inline-block; margin-bottom: 16px;
    }
    #qr-display svg { display: block; width: 240px; height: 240px; }
    #qr-status { font-size: 13px; color: var(--text-muted); min-height: 20px; }
    #qr-status.error { color: var(--danger); }
    .qr-hint { font-size: 11px; color: var(--text-subtle); margin-top: 8px; }
  </style>
</head>
<body>
  <div class="login-shell">
  <div class="login-card" id="login-card">
    <h1>home</h1>
    <p data-i18n="login.subtitle">Sign in to continue</p>
    <div id="login-actions">
      <form action="/auth/login" method="GET" style="width:100%">
        <button class="btn btn-outline" type="submit" style="width:100%">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          <span data-i18n="login.withGoogle">Sign in with Google</span>
        </button>
      </form>
      <div class="divider" data-i18n="login.or">or</div>
      <button class="btn btn-outline" id="qr-btn" onclick="startQR()" style="width:100%">
        <i data-lucide="scan-line" aria-hidden="true"></i>
        <span data-i18n="login.qrButton">扫码登录</span>
      </button>
    </div>
    <div id="qr-section">
      <div id="qr-display"></div>
      <div id="qr-status" data-i18n="qr.generating">正在生成二维码…</div>
      <div class="qr-hint" data-i18n="login.qrHint">用已登录的设备打开摄像头扫描</div>
    </div>
  </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script src="/i18n.js?v=i18n-v3"></script>
<script src="/common.js?v=lucide-v1"></script>
<script>lucide.createIcons(); applyI18n();</script>
<script>
let qrPollTimer = null;

async function startQR() {
  document.getElementById('login-actions').style.display = 'none';
  const section = document.getElementById('qr-section');
  const display = document.getElementById('qr-display');
  const status = document.getElementById('qr-status');
  section.style.display = 'block';
  status.textContent = t('qr.generating');
  status.className = '';

  try {
    const r = await fetch('/auth/qr/create', { method: 'POST' });
    if (!r.ok) throw new Error();
    const data = await r.json();
    display.innerHTML = data.svg;
    status.textContent = t('qr.showHint');

    let count = 0;
    qrPollTimer = setInterval(async () => {
      count++;
      if (count > 150) {
        clearInterval(qrPollTimer);
        status.textContent = t('qr.expired');
        status.className = 'error';
        return;
      }
      try {
        const sr = await fetch('/auth/qr/status?sid=' + data.sid);
        const s = await sr.json();
        if (s.status === 'confirmed' && s.token) {
          clearInterval(qrPollTimer);
          status.textContent = t('qr.success');
          status.className = '';
          window.location.href = '/auth/qr/token?sid=' + data.sid;
        } else if (s.status === 'expired') {
          clearInterval(qrPollTimer);
          status.textContent = t('qr.expired');
          status.className = 'error';
        }
      } catch {}
    }, 2000);
  } catch {
    status.textContent = t('qr.createFailed');
    status.className = 'error';
    document.getElementById('login-actions').style.display = '';
  }
}
</script>
</body>
</html>
